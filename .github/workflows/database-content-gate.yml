name: Database Content Gate

on:
  push:
    branches:
      - feat/database-content-media

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Supabase Data API
        run: |
          set -euo pipefail
          API='https://uketwpczthkflsmoiocs.supabase.co/rest/v1'
          KEY='sb_publishable_OGE2tF4o6NaZWh6WeMYOWg_nT-Zbu3W'
          curl -fsS "$API/tutor_subjects?select=id,name,capabilities&status=eq.published&order=sort_order.asc" -H "apikey: $KEY" > /tmp/subjects.json
          curl -fsS "$API/tutor_lessons?select=id,subject_id,thumbnail_url,content_blocks&status=eq.published&subject_id=eq.tieng-anh&order=sort_order.asc" -H "apikey: $KEY" > /tmp/english.json
          node - <<'JS'
          const fs=require('fs');
          const subjects=JSON.parse(fs.readFileSync('/tmp/subjects.json','utf8'));
          const english=JSON.parse(fs.readFileSync('/tmp/english.json','utf8'));
          if(!subjects.some(s=>s.id==='toan')) throw new Error('Math missing from Data API');
          const en=subjects.find(s=>s.id==='tieng-anh');
          if(!en || en.capabilities?.math !== false) throw new Error('English capabilities are not DB-backed/non-math');
          if(english.length < 2) throw new Error('Expected 2 English lessons');
          if(!english.every(l=>l.thumbnail_url)) throw new Error('English lesson thumbnail missing');
          if(!english.some(l=>l.content_blocks?.some(b=>b.type==='image'))) throw new Error('English image block missing');
          if(!english.some(l=>l.content_blocks?.some(b=>b.type==='dialogue'))) throw new Error('English dialogue block missing');
          console.log({subjects:subjects.length,englishLessons:english.length});
          JS

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0

      - name: Start preview
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/db-content-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/hoc-bai >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/db-content-preview.log
          exit 1

      - name: Browser audit Math and English
        run: |
          cat > db-content-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/db-content-audit';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chrome/Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const failures=[];

          async function auditLesson(name,url,{expectMath}){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const requests=[];
            const failed=[];
            page.on('request',r=>requests.push(r.url()));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
            const res=await page.goto('http://127.0.0.1:4173'+url,{waitUntil:'networkidle',timeout:45000});
            await page.locator('h1').first().waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(500);
            const m=await page.evaluate(()=>({
              h1:document.querySelector('h1')?.textContent?.trim(),
              source:[...document.querySelectorAll('[role="status"]')].map(e=>e.textContent||'').join(' '),
              images:[...document.images].filter(img=>img.offsetWidth>0&&img.offsetHeight>0).map(img=>({src:img.currentSrc||img.src,ok:img.complete&&img.naturalWidth>0})),
              vocabulary:document.querySelectorAll('.vocabulary-card').length,
              dialogue:document.querySelectorAll('.dialogue-line').length,
              katex:document.querySelectorAll('.katex').length,
              illustration:document.querySelectorAll('.learning-illustration').length,
              overflow:document.documentElement.scrollWidth>innerWidth,
            }));
            if(res?.status()!==200) failures.push(`${name}: HTTP ${res?.status()}`);
            if(m.overflow) failures.push(`${name}: horizontal overflow`);
            if(m.images.some(x=>!x.ok)) failures.push(`${name}: broken image ${JSON.stringify(m.images.filter(x=>!x.ok))}`);
            if(!requests.some(u=>u.includes('supabase.co/rest/v1/tutor_'))) failures.push(`${name}: browser did not request Supabase tutor content`);
            if(failed.some(x=>x.url.includes('supabase.co'))) failures.push(`${name}: Supabase request failed ${JSON.stringify(failed)}`);
            if(expectMath){
              if(m.katex===0) failures.push(`${name}: expected KaTeX output`);
            }else{
              if(m.katex!==0) failures.push(`${name}: KaTeX rendered for non-math English content`);
              if(m.vocabulary===0) failures.push(`${name}: vocabulary block missing`);
              if(m.dialogue===0) failures.push(`${name}: dialogue block missing`);
              if(m.illustration===0) failures.push(`${name}: illustration block missing`);
            }
            await page.screenshot({path:`${out}/${name}.png`,fullPage:true});
            await context.close();
            return {name,m,mathChunkRequests:requests.filter(u=>u.includes('MathLatex')),supabaseRequests:requests.filter(u=>u.includes('supabase.co/rest/v1/tutor_'))};
          }

          // Map must show both enrolled subjects and DB-backed images.
          {
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const res=await page.goto('http://127.0.0.1:4173/hoc-bai',{waitUntil:'networkidle',timeout:45000});
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.getByText(/Knowledge Universe · Live DB/i).waitFor({state:'visible',timeout:10000});
            const text=await page.locator('body').innerText();
            const imgs=await page.locator('section[aria-label="Môn học đã đăng ký"] img').count();
            if(res?.status()!==200) failures.push('map: not 200');
            if(!text.includes('Live DB')) failures.push('map: database source marker missing; likely fallback');
            if(!text.includes('Toán')||!text.includes('Tiếng Anh')) failures.push('map: enrolled subject switcher incomplete');
            if(imgs<2) failures.push(`map: expected illustrated subject cards, got ${imgs}`);
            await page.screenshot({path:`${out}/map-subjects.png`,fullPage:true});
            await context.close();
          }

          const english=await auditLesson(
            'english-first-conditional',
            '/hoc-bai?grade=9&subject=tieng-anh&topic=english-foundations&lesson=first-conditional&stage=theory',
            {expectMath:false},
          );
          const math=await auditLesson(
            'math-parabola',
            '/hoc-bai?grade=9&subject=toan&topic=ham-so&lesson=ham-so-bac-hai&stage=theory',
            {expectMath:true},
          );

          fs.writeFileSync(`${out}/report.json`,JSON.stringify({english,math,failures},null,2));
          console.log(JSON.stringify({english,math,failures},null,2));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          JS
          node db-content-audit.mjs

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-content-audit
          path: /tmp/db-content-audit
          retention-days: 3
