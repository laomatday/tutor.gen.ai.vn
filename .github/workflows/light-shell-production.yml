name: Light Shell Production Audit

on:
  push:
    branches:
      - fix/light-shell-fluid-layout

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Audit Railway production
        env:
          BASE_URL: https://tutorgenaivn-production.up.railway.app
        run: |
          cat > prod-shell-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const out='/tmp/light-shell-production';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});

          let deployed=false;
          for(let attempt=0;attempt<30;attempt++){
            const context=await browser.newContext({viewport:{width:1920,height:1080}});
            const page=await context.newPage();
            try{
              await page.goto(process.env.BASE_URL+'/replay',{waitUntil:'networkidle',timeout:30000});
              await page.locator('h1').first().waitFor({state:'visible',timeout:8000});
              await page.evaluate(()=>{
                localStorage.setItem('genai-student-sidebar-pinned-v1','false');
                document.documentElement.classList.remove('dark');
              });
              await page.reload({waitUntil:'networkidle'});
              const light=await page.evaluate(()=>{
                const rail=document.querySelector('.student-icon-rail');
                const header=document.querySelector('.gemini-header');
                return {
                  rail:getComputedStyle(rail).backgroundColor,
                  header:getComputedStyle(header).backgroundColor,
                  recent:document.body.innerText.includes('Gần đây'),
                };
              });
              const nums=(s)=>s.match(/[\d.]+/g)?.slice(0,3).map(Number)||[0,0,0];
              const isLight=(s)=>nums(s).reduce((a,b)=>a+b,0)/3>215;
              deployed=isLight(light.rail)&&isLight(light.header);
            }catch{}
            await context.close();
            if(deployed) break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!deployed) throw new Error('Railway did not serve light shell within deployment window');

          const failures=[];
          const report={};
          const parseRgb=(value)=>value.match(/[\d.]+/g)?.slice(0,3).map(Number)||[0,0,0];
          const isLight=(value)=>parseRgb(value).reduce((a,b)=>a+b,0)/3>215;

          const context=await browser.newContext({viewport:{width:1920,height:1080}});
          const page=await context.newPage();
          const pageErrors=[]; const badResponses=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('response',r=>{if(r.status()>=400) badResponses.push({url:r.url(),status:r.status()});});

          await page.goto(process.env.BASE_URL+'/replay',{waitUntil:'networkidle',timeout:45000});
          await page.locator('h1').first().waitFor({state:'visible'});
          await page.evaluate(()=>{
            localStorage.setItem('genai-student-sidebar-pinned-v1','false');
            localStorage.removeItem('genai-student-recent-routes-v1');
            document.documentElement.classList.remove('dark');
          });
          await page.reload({waitUntil:'networkidle'});
          await page.locator('h1').first().waitFor({state:'visible'});

          const read=()=>page.evaluate(()=>{
            const rail=document.querySelector('.student-icon-rail');
            const panel=document.querySelector('.student-sidebar-panel');
            const header=document.querySelector('.gemini-header');
            const frame=document.querySelector('.app-frame--student');
            const pageEl=document.querySelector('.learning-os-page');
            return {
              railBg:getComputedStyle(rail).backgroundColor,
              panelBg:getComputedStyle(panel).backgroundColor,
              headerBg:getComputedStyle(header).backgroundColor,
              railWidth:Math.round(rail.getBoundingClientRect().width),
              panelWidth:Math.round(panel.getBoundingClientRect().width),
              panelVisible:getComputedStyle(panel).visibility==='visible'&&getComputedStyle(panel).opacity!=='0',
              framePadding:Math.round(parseFloat(getComputedStyle(frame).paddingLeft)),
              learningWidth:Math.round(pageEl.getBoundingClientRect().width),
              scrollWidth:document.documentElement.scrollWidth,
              viewport:innerWidth,
              pinned:localStorage.getItem('genai-student-sidebar-pinned-v1'),
              recent:localStorage.getItem('genai-student-recent-routes-v1'),
            };
          });

          const initial=await read();
          if(!isLight(initial.railBg)||!isLight(initial.headerBg)) failures.push('light shell colors invalid '+JSON.stringify(initial));
          if(initial.railWidth!==60||initial.panelVisible||initial.framePadding!==60) failures.push('collapsed shell invalid '+JSON.stringify(initial));
          if(initial.learningWidth<1650) failures.push('content too narrow '+initial.learningWidth);
          if(initial.scrollWidth!==initial.viewport) failures.push('horizontal overflow');

          const logo=page.getByRole('button',{name:/mở sidebar/i}).first();
          await logo.click();
          await page.waitForTimeout(220);
          const opened=await read();
          if(!opened.panelVisible||opened.panelWidth!==288||opened.framePadding!==348) failures.push('logo open invalid '+JSON.stringify(opened));
          if(!await page.getByText('Đã ghim',{exact:true}).isVisible()) failures.push('pinned section missing');
          if(!await page.getByText('Gần đây',{exact:true}).isVisible()) failures.push('recent section missing');

          const pin=page.getByRole('button',{name:/giữ sidebar mở/i}).first();
          await pin.click();
          await page.waitForTimeout(150);
          await page.getByRole('button',{name:/knowledge map/i}).first().click();
          await page.locator('h1').first().waitFor({state:'visible'});
          await page.waitForTimeout(180);
          const afterNav=await read();
          if(afterNav.pinned!=='true'||!afterNav.panelVisible) failures.push('pin persistence across navigation failed '+JSON.stringify(afterNav));

          await page.reload({waitUntil:'networkidle'});
          await page.locator('h1').first().waitFor({state:'visible'});
          const afterReload=await read();
          if(afterReload.pinned!=='true'||!afterReload.panelVisible) failures.push('pin persistence after reload failed '+JSON.stringify(afterReload));
          const sidebarText=await page.locator('.student-sidebar-panel').innerText();
          if(!sidebarText.includes('Knowledge Map')) failures.push('recent route missing');

          await page.keyboard.press('Control+K');
          const focused=await page.evaluate(()=>document.activeElement?.getAttribute('aria-label'));
          if(focused!=='Tìm bài học, chủ đề hoặc câu hỏi') failures.push('Ctrl+K search focus failed');
          if(!(await page.getByText('Deep Focus',{exact:true}).count())) failures.push('Deep Focus missing');

          await page.screenshot({path:out+'/production-light-shell-open.png',fullPage:true});

          if(pageErrors.length) failures.push('page errors '+JSON.stringify(pageErrors));
          if(badResponses.length) failures.push('bad responses '+JSON.stringify(badResponses));
          report.initial=initial;
          report.opened=opened;
          report.afterNav=afterNav;
          report.afterReload=afterReload;
          report.focused=focused;

          fs.writeFileSync(out+'/report.json',JSON.stringify({report,failures},null,2));
          console.log(JSON.stringify({report,failures},null,2));
          await context.close();
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          JS
          node prod-shell-audit.mjs
      - name: Upload production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-shell-production
          path: /tmp/light-shell-production
          retention-days: 3
