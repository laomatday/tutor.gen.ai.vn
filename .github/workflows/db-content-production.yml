name: DB Content Production Audit
on:
  push:
    branches: [feat/database-content-media]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Audit Railway DB content
        env:
          BASE_URL: https://tutorgenaivn-production.up.railway.app
        run: |
          cat > prod-db-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/db-content-production'; fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          let deployed=false;
          for(let attempt=0;attempt<30;attempt++){
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            try{
              await page.goto(process.env.BASE_URL+'/hoc-bai',{waitUntil:'networkidle',timeout:30000});
              deployed=await page.getByText(/Knowledge Universe.*Live DB/i).first().isVisible().catch(()=>false);
            }catch{}
            await ctx.close();
            if(deployed) break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!deployed) throw new Error('Railway did not serve DB-first content within deployment window');

          const failures=[]; const report={};
          {
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            const requests=[]; page.on('request',r=>requests.push(r.url()));
            await page.goto(process.env.BASE_URL+'/hoc-bai',{waitUntil:'networkidle'});
            await page.getByText(/Knowledge Universe.*Live DB/i).first().waitFor({state:'visible'});
            const region=page.locator('section[aria-label="Môn học đã đăng ký"]');
            const text=await region.innerText();
            const imgs=await region.locator('img').count();
            if(!text.includes('Toán')||!text.includes('Tiếng Anh')) failures.push('Map subject switcher incomplete');
            if(imgs<2) failures.push('Map illustrated subject cards missing');
            if(!requests.some(u=>u.includes('supabase.co/rest/v1/tutor_subjects'))) failures.push('Map missing live Supabase request');
            await page.screenshot({path:out+'/map-subjects.png',fullPage:true});
            report.map={text,imgs,supabaseRequests:requests.filter(u=>u.includes('supabase.co/rest/v1/tutor_'))};
            await ctx.close();
          }

          async function lesson(name,path,expectMath){
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            const requests=[]; const failed=[];
            page.on('request',r=>requests.push(r.url()));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
            const res=await page.goto(process.env.BASE_URL+path,{waitUntil:'networkidle',timeout:45000});
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.waitForTimeout(400);
            const m=await page.evaluate(()=>({
              h1:document.querySelector('h1')?.textContent?.trim(),
              katex:document.querySelectorAll('.katex').length,
              vocab:document.querySelectorAll('.vocabulary-card').length,
              dialogue:document.querySelectorAll('.dialogue-line').length,
              illustration:document.querySelectorAll('.learning-illustration').length,
              overflow:document.documentElement.scrollWidth>innerWidth,
              broken:[...document.images].filter(img=>img.offsetWidth>0&&img.offsetHeight>0).filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.currentSrc||img.src),
            }));
            if(res?.status()!==200) failures.push(name+' HTTP '+res?.status());
            if(m.overflow) failures.push(name+' overflow');
            if(m.broken.length) failures.push(name+' broken images '+JSON.stringify(m.broken));
            if(failed.some(x=>x.url.includes('supabase.co'))) failures.push(name+' failed Supabase '+JSON.stringify(failed));
            if(!requests.some(u=>u.includes('supabase.co/rest/v1/tutor_lessons'))) failures.push(name+' missing live lesson DB request');
            if(expectMath && m.katex===0) failures.push(name+' missing KaTeX');
            if(!expectMath && m.katex!==0) failures.push(name+' unexpectedly rendered KaTeX');
            if(!expectMath && (m.vocab===0||m.dialogue===0||m.illustration===0)) failures.push(name+' missing English blocks');
            await page.screenshot({path:out+'/'+name+'.png',fullPage:true});
            await ctx.close();
            return {m,mathChunk:requests.some(u=>u.includes('MathLatex')),supabase:requests.filter(u=>u.includes('supabase.co/rest/v1/tutor_'))};
          }

          report.english=await lesson('english','/hoc-bai?grade=9&subject=tieng-anh&topic=english-foundations&lesson=first-conditional&stage=theory',false);
          report.math=await lesson('math','/hoc-bai?grade=9&subject=toan&topic=ham-so&lesson=ham-so-bac-hai&stage=theory',true);
          report.failures=failures;
          fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          JS
          node prod-db-audit.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-content-production
          path: /tmp/db-content-production
          retention-days: 3
