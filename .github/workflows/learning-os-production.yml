name: Learning OS Production Audit

on:
  push:
    branches:
      - feat/learning-os

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Audit Railway
        env:
          BASE_URL: https://tutorgenaivn-production.up.railway.app
        run: |
          cat > prod-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/learning-os-production'; fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const routes=[
            {path:'/',name:'mission',expect:'Mission'},
            {path:'/hoc-bai',name:'map',expect:'Map'},
            {path:'/tu-giai',name:'studio',expect:'Studio'},
            {path:'/replay',name:'replay',expect:'Replay'},
          ];
          const sizes=[{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}];
          const report=[]; const failures=[];
          for(const size of sizes){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height}});
            const page=await context.newPage();
            const pageErrors=[]; const badResponses=[]; const failedRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) badResponses.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));
            for(const route of routes){
              const res=await page.goto(process.env.BASE_URL+route.path,{waitUntil:'networkidle',timeout:45000});
              await page.locator('h1').first().waitFor({state:'visible',timeout:10000});
              await page.waitForTimeout(250);
              const metrics=await page.evaluate((routeName)=>{
                const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};
                const dialogs=[...document.querySelectorAll('dialog')].map(el=>({open:el.open,display:getComputedStyle(el).display}));
                const broken=[...document.images].filter(visible).filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.currentSrc||img.src);
                const tiny=[...document.querySelectorAll('body *')].filter(visible).filter(el=>parseFloat(getComputedStyle(el).fontSize)<12&&!el.classList.contains('sr-only')&&!el.closest('.katex')).length;
                const routeSpecific={
                  mission: document.querySelector('.mission-hero')!==null,
                  map: document.querySelector('.knowledge-canvas, .knowledge-path')!==null,
                  studio: document.querySelector('.studio-canvas')!==null && document.querySelector('.ai-pulse')!==null && document.querySelector('textarea')!==null,
                  replay: document.querySelector('.replay-hero')!==null && [...document.querySelectorAll('h2')].some(el=>/Mistake DNA|Hồ sơ lỗi sai/i.test(el.textContent||'')),
                }[routeName];
                return {
                  width:innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  h1:document.querySelector('h1')?.textContent?.trim()||'',
                  dialogs,
                  broken,
                  tiny,
                  routeSpecific,
                  font:getComputedStyle(document.body).fontFamily,
                };
              }, route.name);

              let mobileMenu=null;
              if(size.width<1024 && route.name==='mission'){
                const menu=page.getByRole('button',{name:/mở menu/i}).first();
                await menu.click();
                await page.waitForTimeout(150);
                mobileMenu=await page.evaluate(()=>{
                  const overlay=[...document.querySelectorAll('div[aria-hidden="true"]')].find(el=>el.classList.contains('fixed')&&el.classList.contains('inset-0')&&el.classList.contains('z-40'));
                  const nav=document.querySelector('#main-navigation');
                  return {
                    expanded:document.querySelector('button[aria-controls="main-navigation"]')?.getAttribute('aria-expanded'),
                    navVisible:nav?getComputedStyle(nav).transform!=='none'||getComputedStyle(nav).translate!=='none':false,
                    overlay:overlay?getComputedStyle(overlay).backgroundColor:null,
                  };
                });
                await page.keyboard.press('Escape').catch(()=>{});
                await page.reload({waitUntil:'networkidle'});
                await page.locator('h1').first().waitFor({state:'visible',timeout:10000});
              }

              await page.screenshot({path:`${out}/${size.name}-${route.name}.png`,fullPage:true});
              const errors=[];
              if(res?.status()!==200) errors.push(`HTTP ${res?.status()}`);
              if(metrics.scrollWidth!==metrics.width) errors.push(`overflow ${metrics.scrollWidth}>${metrics.width}`);
              if(metrics.dialogs.some(d=>!d.open&&d.display!=='none')) errors.push('closed dialog visible');
              if(metrics.broken.length) errors.push(`broken images ${JSON.stringify(metrics.broken)}`);
              if(metrics.tiny) errors.push(`tiny UI text ${metrics.tiny}`);
              if(!metrics.routeSpecific) errors.push('route-specific surface missing');
              if(mobileMenu && (!mobileMenu.overlay || mobileMenu.overlay==='rgba(0, 0, 0, 0)')) errors.push('mobile backdrop missing');
              report.push({size:size.name,route:route.name,status:res?.status(),metrics,mobileMenu,errors});
              failures.push(...errors.map(e=>`${size.name}/${route.name}: ${e}`));
            }
            if(pageErrors.length) failures.push(`${size.name}: page errors ${JSON.stringify(pageErrors)}`);
            if(badResponses.length) failures.push(`${size.name}: bad responses ${JSON.stringify(badResponses)}`);
            if(failedRequests.length) failures.push(`${size.name}: failed requests ${JSON.stringify(failedRequests)}`);
            await context.close();
          }
          fs.writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failures.length){console.error('\nFAILURES\n'+failures.join('\n')); process.exit(1);}
          JS
          node prod-audit.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-os-production
          path: /tmp/learning-os-production
          retention-days: 3
