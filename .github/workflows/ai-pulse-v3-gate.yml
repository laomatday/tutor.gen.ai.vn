name: AI Pulse V3 Visual Gate

on:
  push:
    branches:
      - feat/ui-v3-ai-pulse

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Start preview
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/v3-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-preview.log
          exit 1
      - name: Visual and interaction audit
        run: |
          cat > v3-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const out='/tmp/ai-pulse-v3';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const routes=[
            {name:'home',path:'/',selector:'.ai-v3-dashboard-grid'},
            {name:'map',path:'/hoc-bai',selector:'.ai-v3-map-layout'},
            {name:'studio',path:'/tu-giai',selector:'.ai-v3-studio-layout'},
            {name:'replay',path:'/replay',selector:'.ai-v3-replay-layout'},
          ];
          const report=[]; const failures=[];

          for(const size of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}]){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height}});
            const page=await context.newPage();
            const pageErrors=[]; const badResponses=[]; const requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) badResponses.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));

            for(const route of routes){
              const res=await page.goto('http://127.0.0.1:4173'+route.path,{waitUntil:'networkidle',timeout:45000});
              await page.locator('h1').first().waitFor({state:'visible',timeout:10000});
              await page.locator(route.selector).first().waitFor({state:'visible',timeout:10000});
              await page.waitForTimeout(200);
              const m=await page.evaluate(()=>{
                const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};
                return {
                  width:innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  h1:document.querySelector('h1')?.textContent?.trim()||'',
                  tiny:[...document.querySelectorAll('body *')].filter(visible).filter(el=>parseFloat(getComputedStyle(el).fontSize)<12&&!el.classList.contains('sr-only')&&!el.closest('.katex')).length,
                  broken:[...document.images].filter(visible).filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.currentSrc||img.src),
                  dialogs:[...document.querySelectorAll('dialog')].map(el=>({open:el.open,display:getComputedStyle(el).display})),
                  bottomNav:!![...document.querySelectorAll('.student-bottom-nav')].find(visible),
                  commandSearch:!![...document.querySelectorAll('.student-command-search')].find(visible),
                };
              });
              const errors=[];
              if(res?.status()!==200) errors.push('HTTP '+res?.status());
              if(m.scrollWidth!==m.width) errors.push('horizontal overflow '+m.scrollWidth+'>'+m.width);
              if(m.tiny) errors.push('UI text below 12px: '+m.tiny);
              if(m.broken.length) errors.push('broken images '+JSON.stringify(m.broken));
              if(m.dialogs.some(d=>!d.open&&d.display!=='none')) errors.push('closed dialog visible');
              if(size.name==='mobile'&&!m.bottomNav) errors.push('mobile bottom nav missing');
              if(size.name==='desktop'&&!m.commandSearch) errors.push('desktop command search missing');
              failures.push(...errors.map(e=>size.name+'/'+route.name+': '+e));
              report.push({size:size.name,route:route.name,status:res?.status(),metrics:m,errors});
              await page.screenshot({path:`${out}/${size.name}-${route.name}.png`,fullPage:true});
            }
            if(pageErrors.length) failures.push(size.name+': page errors '+JSON.stringify(pageErrors));
            if(badResponses.length) failures.push(size.name+': bad responses '+JSON.stringify(badResponses));
            if(requestFailures.filter(x=>!x.url.includes('googleusercontent.com')).length) failures.push(size.name+': request failures '+JSON.stringify(requestFailures));
            await context.close();
          }

          // Desktop sidebar persistence and command search shortcut
          {
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.setItem('genai-student-sidebar-expanded-v1','false'));
            await page.reload({waitUntil:'networkidle'});
            const readWidth=()=>page.evaluate(()=>Math.round(document.querySelector('#main-navigation')?.getBoundingClientRect().width||0));
            const collapsed=await readWidth();
            await page.getByRole('button',{name:/mở rộng thanh điều hướng/i}).click();
            await page.waitForTimeout(220);
            const expanded=await readWidth();
            await page.keyboard.press(process.platform==='darwin'?'Meta+K':'Control+K');
            const searchFocused=await page.locator('.student-command-search__input').evaluate(el=>document.activeElement===el);
            if(collapsed!==80) failures.push('sidebar collapsed expected 80 got '+collapsed);
            if(expanded!==280) failures.push('sidebar expanded expected 280 got '+expanded);
            if(!searchFocused) failures.push('command search shortcut did not focus input');
            report.push({interaction:'shell',collapsed,expanded,searchFocused});
            await context.close();
          }

          fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failures.length){console.error('\nFAILURES\n'+failures.join('\n'));process.exit(1);}
          JS
          node v3-audit.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-v3
          path: /tmp/ai-pulse-v3
          retention-days: 3
