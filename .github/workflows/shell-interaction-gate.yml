name: Shell Interaction Gate

on:
  push:
    branches:
      - feat/chatgpt-sidebar-gemini-header

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Start preview
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/shell-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/shell-preview.log
          exit 1
      - name: Audit shell interactions
        run: |
          cat > shell-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/shell-audit';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const failures=[]; const report={};

          // Desktop ChatGPT-style sidebar
          {
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.evaluate(()=>{
              localStorage.setItem('genai-student-sidebar-pinned-v1','false');
            });
            await page.reload({waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            const read=()=>page.evaluate(()=>{
              const shell=document.querySelector('#main-navigation');
              const panel=document.querySelector('#student-sidebar-panel');
              const frame=document.querySelector('.app-frame--student');
              const header=document.querySelector('.gemini-header');
              const logo=document.querySelector('.student-logo-trigger');
              return {
                railWidth:shell?Math.round(shell.getBoundingClientRect().width):0,
                panelVisible:panel?getComputedStyle(panel).visibility:'missing',
                panelWidth:panel?Math.round(panel.getBoundingClientRect().width):0,
                framePadding:frame?Math.round(parseFloat(getComputedStyle(frame).paddingLeft)):0,
                headerLeft:header?Math.round(parseFloat(getComputedStyle(header).left)):0,
                logoExpanded:logo?.getAttribute('aria-expanded'),
                pinned:localStorage.getItem('genai-student-sidebar-pinned-v1'),
              };
            });

            const collapsed=await read();
            const logo=page.getByRole('button',{name:/mở sidebar/i}).first();
            if(!(await logo.count())) failures.push('desktop: logo sidebar trigger missing');
            else await logo.click();
            await page.waitForTimeout(250);
            const opened=await read();
            await page.screenshot({path:out+'/desktop-sidebar-open.png',fullPage:true});

            const pin=page.getByRole('button',{name:/giữ sidebar mở/i});
            if(!(await pin.count())) failures.push('desktop: pin control missing');
            else await pin.click();
            await page.waitForTimeout(200);
            const pinned=await read();
            await page.reload({waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.waitForTimeout(200);
            const persisted=await read();

            // Unpin but keep the panel temporarily open.
            const unpin=page.getByRole('button',{name:/bỏ ghim sidebar/i});
            await unpin.click();
            await page.waitForTimeout(150);
            const unpinnedOpen=await read();
            await page.getByRole('button',{name:'Knowledge Map'}).last().click();
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.waitForTimeout(200);
            const afterNavigation=await read();

            if(collapsed.railWidth!==60) failures.push('desktop: rail must be 60px '+JSON.stringify(collapsed));
            if(collapsed.panelVisible!=='hidden') failures.push('desktop: panel visible initially '+JSON.stringify(collapsed));
            if(opened.panelVisible!=='visible'||opened.panelWidth!==288) failures.push('desktop: logo did not reveal 288px panel '+JSON.stringify(opened));
            if(opened.framePadding!==348||opened.headerLeft!==348) failures.push('desktop: content/header not shifted by rail+panel '+JSON.stringify(opened));
            if(pinned.pinned!=='true') failures.push('desktop: pin state not stored '+JSON.stringify(pinned));
            if(persisted.panelVisible!=='visible'||persisted.pinned!=='true') failures.push('desktop: pinned sidebar not persistent '+JSON.stringify(persisted));
            if(unpinnedOpen.panelVisible!=='visible'||unpinnedOpen.pinned!=='false') failures.push('desktop: unpin should keep temporary panel open '+JSON.stringify(unpinnedOpen));
            if(afterNavigation.panelVisible!=='hidden'||afterNavigation.framePadding!==60) failures.push('desktop: unpinned panel should close after navigation '+JSON.stringify(afterNavigation));

            const headerMetrics=await page.evaluate(()=>({
              height:Math.round(document.querySelector('.gemini-header')?.getBoundingClientRect().height||0),
              contextVisible:!!document.querySelector('.gemini-context-pill'),
              searchVisible:getComputedStyle(document.querySelector('.gemini-command-search')).display!=='none',
              profileVisible:!!document.querySelector('.gemini-profile-trigger'),
              overflow:document.documentElement.scrollWidth>innerWidth,
            }));
            if(headerMetrics.height!==60) failures.push('desktop: Gemini header expected 60px '+JSON.stringify(headerMetrics));
            if(!headerMetrics.contextVisible||!headerMetrics.searchVisible||!headerMetrics.profileVisible) failures.push('desktop: Gemini header controls missing '+JSON.stringify(headerMetrics));
            if(headerMetrics.overflow) failures.push('desktop: horizontal overflow');

            // Cmd/Ctrl+K
            await page.keyboard.press('Control+K');
            const focused=await page.evaluate(()=>document.activeElement?.getAttribute('aria-label'));
            if(focused!=='Tìm bài học, chủ đề hoặc câu hỏi') failures.push('desktop: Ctrl+K did not focus search');

            report.desktop={collapsed,opened,pinned,persisted,unpinnedOpen,afterNavigation,headerMetrics,errors};
            failures.push(...errors.map(e=>'desktop pageerror: '+e));
            await context.close();
          }

          // Mobile drawer + compact header
          {
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            const menu=page.getByRole('button',{name:/mở menu/i}).first();
            if(!(await menu.count())) failures.push('mobile: menu trigger missing');
            else await menu.click();
            await page.waitForTimeout(150);
            const m=await page.evaluate(()=>{
              const nav=document.querySelector('#main-navigation');
              const panel=document.querySelector('#student-sidebar-panel');
              const rail=document.querySelector('.student-icon-rail');
              const overlay=[...document.querySelectorAll('div[aria-hidden="true"]')].find(el=>el.classList.contains('z-40'));
              return {
                navWidth:nav?Math.round(nav.getBoundingClientRect().width):0,
                panelVisible:panel?getComputedStyle(panel).visibility:'missing',
                railDisplay:rail?getComputedStyle(rail).display:'missing',
                overlay:overlay?getComputedStyle(overlay).backgroundColor:null,
                overflow:document.documentElement.scrollWidth>innerWidth,
              };
            });
            if(m.navWidth<300||m.navWidth>360) failures.push('mobile: drawer width unexpected '+JSON.stringify(m));
            if(m.railDisplay!=='none') failures.push('mobile: icon rail should be hidden '+JSON.stringify(m));
            if(!m.overlay||m.overlay==='rgba(0, 0, 0, 0)') failures.push('mobile: drawer backdrop missing '+JSON.stringify(m));
            if(m.overflow) failures.push('mobile: horizontal overflow');
            await page.screenshot({path:out+'/mobile-drawer.png',fullPage:true});
            report.mobile=m;
            await context.close();
          }

          fs.writeFileSync(out+'/report.json',JSON.stringify({report,failures},null,2));
          console.log(JSON.stringify({report,failures},null,2));
          await browser.close();
          if(failures.length){console.error('\nFAILURES\n'+failures.join('\n'));process.exit(1);}
          JS
          node shell-audit.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-interaction-audit
          path: /tmp/shell-audit
          retention-days: 3
