name: AI Pulse V3 Production Audit
on:
  push:
    branches:
      - feat/ui-v3-ai-pulse
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Audit Railway V3
        env:
          BASE_URL: https://tutorgenaivn-production.up.railway.app
        run: |
          cat > prod-v3-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/ai-pulse-v3-production';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const failures=[]; const report=[];

          // Deployment marker: wait for V3 shell + V3 home.
          let deployed=false;
          for(let attempt=0;attempt<24;attempt++){
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            try{
              await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle',timeout:30000});
              deployed=(await page.locator('.ai-v3-dashboard-grid').count())>0 &&
                       (await page.locator('.student-command-search').count())>0;
            }catch{}
            await ctx.close();
            if(deployed) break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!deployed) throw new Error('Railway did not serve AI Pulse V3 within deployment window');

          const routes=[
            {name:'home',path:'/',selector:'.ai-v3-dashboard-grid'},
            {name:'map',path:'/hoc-bai',selector:'.ai-v3-map-layout'},
            {name:'studio',path:'/tu-giai',selector:'.ai-v3-studio-layout'},
            {name:'replay',path:'/replay',selector:'.ai-v3-replay-layout'},
          ];

          for(const size of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}]){
            const ctx=await browser.newContext({viewport:{width:size.width,height:size.height}});
            const page=await ctx.newPage();
            const pageErrors=[]; const badResponses=[]; const failedRequests=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) badResponses.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));

            for(const route of routes){
              const res=await page.goto(process.env.BASE_URL+route.path,{waitUntil:'networkidle',timeout:45000});
              await page.locator('h1').first().waitFor({state:'visible',timeout:10000});
              await page.locator(route.selector).first().waitFor({state:'visible',timeout:10000});
              await page.waitForTimeout(250);
              const m=await page.evaluate(()=>{
                const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};
                return {
                  width:innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  h1:document.querySelector('h1')?.textContent?.trim()||'',
                  tiny:[...document.querySelectorAll('body *')].filter(visible).filter(el=>parseFloat(getComputedStyle(el).fontSize)<12&&!el.classList.contains('sr-only')&&!el.closest('.katex')).length,
                  broken:[...document.images].filter(visible).filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.currentSrc||img.src),
                  dialogs:[...document.querySelectorAll('dialog')].map(el=>({open:el.open,display:getComputedStyle(el).display})),
                  bottomNav:!![...document.querySelectorAll('.student-bottom-nav')].find(visible),
                  commandSearch:!![...document.querySelectorAll('.student-command-search')].find(visible),
                };
              });
              const errors=[];
              if(res?.status()!==200) errors.push('HTTP '+res?.status());
              if(m.scrollWidth!==m.width) errors.push('overflow '+m.scrollWidth+'>'+m.width);
              if(m.tiny) errors.push('tiny UI text '+m.tiny);
              if(m.broken.length) errors.push('broken images '+JSON.stringify(m.broken));
              if(m.dialogs.some(d=>!d.open&&d.display!=='none')) errors.push('closed dialog visible');
              if(size.name==='mobile'&&!m.bottomNav) errors.push('mobile bottom nav missing');
              if(size.name==='desktop'&&!m.commandSearch) errors.push('desktop command search missing');
              failures.push(...errors.map(e=>size.name+'/'+route.name+': '+e));
              report.push({size:size.name,route:route.name,status:res?.status(),metrics:m,errors});
              await page.screenshot({path:`${out}/${size.name}-${route.name}.png`,fullPage:true});
            }
            const realFailures=failedRequests.filter(x=>!x.url.includes('googleusercontent.com'));
            if(pageErrors.length) failures.push(size.name+': page errors '+JSON.stringify(pageErrors));
            if(badResponses.length) failures.push(size.name+': bad responses '+JSON.stringify(badResponses));
            if(realFailures.length) failures.push(size.name+': request failures '+JSON.stringify(realFailures));
            await ctx.close();
          }

          // DB-first marker on Knowledge Universe and English non-math regression.
          {
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            const requests=[]; page.on('request',r=>requests.push(r.url()));
            await page.goto(process.env.BASE_URL+'/hoc-bai',{waitUntil:'networkidle'});
            await page.getByText(/Knowledge Universe.*Live DB/i).first().waitFor({state:'visible',timeout:10000});
            if(!requests.some(u=>u.includes('supabase.co/rest/v1/tutor_subjects'))) failures.push('DB-first Map missing tutor_subjects request');
            await ctx.close();
          }
          {
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            await page.goto(process.env.BASE_URL+'/hoc-bai?grade=9&subject=tieng-anh&topic=english-foundations&lesson=first-conditional&stage=theory',{waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            const english=await page.evaluate(()=>({
              katex:document.querySelectorAll('.katex').length,
              vocab:document.querySelectorAll('.vocabulary-card').length,
              dialogue:document.querySelectorAll('.dialogue-line').length,
              illustration:document.querySelectorAll('.learning-illustration').length,
            }));
            if(english.katex!==0) failures.push('English unexpectedly renders KaTeX');
            if(english.vocab===0||english.dialogue===0||english.illustration===0) failures.push('English content block regression '+JSON.stringify(english));
            report.push({regression:'english',...english});
            await ctx.close();
          }

          // Shell interactions.
          {
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.setItem('genai-student-sidebar-expanded-v1','false'));
            await page.reload({waitUntil:'networkidle'});
            const read=()=>page.evaluate(()=>({
              width:Math.round(document.querySelector('#main-navigation')?.getBoundingClientRect().width||0),
              frame:Math.round(parseFloat(getComputedStyle(document.querySelector('.app-frame--student')).paddingLeft)||0)
            }));
            const collapsed=await read();
            await page.getByRole('button',{name:/mở rộng thanh điều hướng/i}).click();
            await page.waitForTimeout(220);
            const expanded=await read();
            await page.keyboard.press('Control+K');
            const searchFocused=await page.locator('.student-command-search__input').evaluate(el=>document.activeElement===el);
            if(collapsed.width!==80) failures.push('sidebar collapsed '+JSON.stringify(collapsed));
            if(expanded.width!==280||expanded.frame!==280) failures.push('sidebar expanded '+JSON.stringify(expanded));
            if(!searchFocused) failures.push('Ctrl+K did not focus search');
            report.push({interaction:'shell',collapsed,expanded,searchFocused});
            await ctx.close();
          }

          fs.writeFileSync(out+'/report.json',JSON.stringify({report,failures},null,2));
          console.log(JSON.stringify({report,failures},null,2));
          await browser.close();
          if(failures.length){console.error('\nPRODUCTION FAILURES\n'+failures.join('\n'));process.exit(1);}
          JS
          node prod-v3-audit.mjs
      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-v3-production
          path: /tmp/ai-pulse-v3-production
          retention-days: 3
