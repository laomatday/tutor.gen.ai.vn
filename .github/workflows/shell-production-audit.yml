name: Shell Production Audit

on:
  push:
    branches:
      - feat/chatgpt-sidebar-gemini-header

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Audit Railway shell
        env:
          BASE_URL: https://tutorgenaivn-production.up.railway.app
        run: |
          cat > prod-shell-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/shell-production';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});

          let deployed=false;
          for(let attempt=0;attempt<30;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            try{
              await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle',timeout:30000});
              deployed=await page.locator('.gemini-header').isVisible().catch(()=>false)
                && await page.locator('.student-logo-trigger').isVisible().catch(()=>false);
            }catch{}
            await context.close();
            if(deployed) break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!deployed) throw new Error('Railway did not serve the new shell within the deployment window');

          const failures=[]; const report={};

          {
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const bad=[]; const failed=[];
            page.on('response',r=>{if(r.status()>=400) bad.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText}));
            await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.evaluate(()=>localStorage.setItem('genai-student-sidebar-pinned-v1','false'));
            await page.reload({waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});

            const read=()=>page.evaluate(()=>{
              const nav=document.querySelector('#main-navigation');
              const panel=document.querySelector('#student-sidebar-panel');
              const frame=document.querySelector('.app-frame--student');
              const header=document.querySelector('.gemini-header');
              return {
                railWidth:nav?Math.round(nav.getBoundingClientRect().width):0,
                panelVisible:panel?getComputedStyle(panel).visibility:'missing',
                panelWidth:panel?Math.round(panel.getBoundingClientRect().width):0,
                framePadding:frame?Math.round(parseFloat(getComputedStyle(frame).paddingLeft)):0,
                headerLeft:header?Math.round(parseFloat(getComputedStyle(header).left)):0,
                headerHeight:header?Math.round(header.getBoundingClientRect().height):0,
                overflow:document.documentElement.scrollWidth>innerWidth,
              };
            });

            const collapsed=await read();
            await page.getByRole('button',{name:/mở sidebar/i}).click();
            await page.waitForTimeout(200);
            const opened=await read();
            await page.screenshot({path:out+'/desktop-shell.png',fullPage:true});

            if(collapsed.railWidth!==60||collapsed.panelVisible!=='hidden') failures.push('desktop collapsed invalid '+JSON.stringify(collapsed));
            if(opened.panelWidth!==288||opened.panelVisible!=='visible'||opened.framePadding!==348||opened.headerLeft!==348) failures.push('desktop opened invalid '+JSON.stringify(opened));
            if(opened.headerHeight!==60||opened.overflow) failures.push('desktop header/overflow invalid '+JSON.stringify(opened));
            if(bad.length) failures.push('desktop bad responses '+JSON.stringify(bad));
            if(failed.length) failures.push('desktop failed requests '+JSON.stringify(failed));

            report.desktop={collapsed,opened,bad,failed};
            await context.close();
          }

          {
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            const menu=page.getByRole('button',{name:/mở menu/i}).first();
            await menu.click();
            await page.waitForTimeout(150);
            const mobile=await page.evaluate(()=>{
              const nav=document.querySelector('#main-navigation');
              const rail=document.querySelector('.student-icon-rail');
              return {
                navWidth:nav?Math.round(nav.getBoundingClientRect().width):0,
                railDisplay:rail?getComputedStyle(rail).display:'missing',
                overflow:document.documentElement.scrollWidth>innerWidth,
              };
            });
            if(mobile.navWidth<300||mobile.navWidth>360||mobile.railDisplay!=='none'||mobile.overflow) failures.push('mobile drawer invalid '+JSON.stringify(mobile));
            await page.screenshot({path:out+'/mobile-shell.png',fullPage:true});
            report.mobile=mobile;
            await context.close();
          }

          fs.writeFileSync(out+'/report.json',JSON.stringify({report,failures},null,2));
          console.log(JSON.stringify({report,failures},null,2));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          JS
          node prod-shell-audit.mjs
      - name: Upload production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-production
          path: /tmp/shell-production
          retention-days: 3
