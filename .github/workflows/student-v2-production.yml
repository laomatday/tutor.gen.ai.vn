name: Student V2 Production Audit

on:
  push:
    branches:
      - feat/student-experience-v2

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Audit Railway production
        env:
          BASE_URL: https://tutorgenaivn-production.up.railway.app
        run: |
          cat > student-v2-prod.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const out='/tmp/student-v2-production';
          fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No Chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});

          // Wait until Railway actually serves Student Experience V2.
          let deployed=false;
          for(let attempt=0;attempt<30;attempt++){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            try{
              await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle',timeout:30000});
              const toggle=page.getByRole('button',{name:/mở rộng thanh điều hướng|thu gọn thanh điều hướng/i});
              deployed=(await toggle.count())>0;
            }catch{}
            await context.close();
            if(deployed) break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!deployed) throw new Error('Railway did not serve Student Experience V2 within deployment window');

          const routes=[
            {name:'mission',path:'/'},
            {name:'map',path:'/hoc-bai'},
            {name:'lesson',path:'/hoc-bai?grade=9&subject=toan&topic=ham-so&lesson=ham-so-bac-hai&stage=theory'},
            {name:'studio',path:'/tu-giai'},
            {name:'replay',path:'/replay'},
            {name:'assessment',path:'/thi-thu'},
            {name:'radar',path:'/tien-bo'},
            {name:'schedule',path:'/thoi-khoa-bieu'},
            {name:'rewards',path:'/doi-qua'},
          ];
          const failures=[];
          const report=[];

          for(const size of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}]){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height}});
            const page=await context.newPage();
            const pageErrors=[]; const badResponses=[]; const requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) badResponses.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));

            for(const route of routes){
              const res=await page.goto(process.env.BASE_URL+route.path,{waitUntil:'networkidle',timeout:45000});
              await page.locator('h1').first().waitFor({state:'visible',timeout:10000});
              await page.waitForTimeout(150);
              const m=await page.evaluate(()=>{
                const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};
                return {
                  width:innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  h1:document.querySelector('h1')?.textContent?.trim()||'',
                  tiny:[...document.querySelectorAll('body *')].filter(visible).filter(el=>parseFloat(getComputedStyle(el).fontSize)<12&&!el.classList.contains('sr-only')&&!el.closest('.katex')).length,
                  broken:[...document.images].filter(visible).filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.currentSrc||img.src),
                  dialogs:[...document.querySelectorAll('dialog')].map(el=>({open:el.open,display:getComputedStyle(el).display})),
                  bottomNavVisible:!![...document.querySelectorAll('.student-bottom-nav')].find(visible),
                  sharedHero:document.querySelector('.student-page-hero')!==null,
                  font:getComputedStyle(document.body).fontFamily,
                };
              });
              const errors=[];
              if(res?.status()!==200) errors.push(`HTTP ${res?.status()}`);
              if(m.scrollWidth!==m.width) errors.push(`overflow ${m.scrollWidth}>${m.width}`);
              if(m.tiny) errors.push(`tiny UI text ${m.tiny}`);
              if(m.broken.length) errors.push(`broken images ${JSON.stringify(m.broken)}`);
              if(m.dialogs.some(d=>!d.open&&d.display!=='none')) errors.push('closed dialog visible');
              if(size.name==='mobile'&&!m.bottomNavVisible) errors.push('mobile bottom nav not visible');
              failures.push(...errors.map(e=>`${size.name}/${route.name}: ${e}`));
              report.push({size:size.name,route:route.name,status:res?.status(),metrics:m,errors});
              if(['mission','lesson','assessment','schedule','rewards'].includes(route.name)){
                await page.screenshot({path:`${out}/${size.name}-${route.name}.png`,fullPage:true});
              }
            }
            if(pageErrors.length) failures.push(`${size.name}: page errors ${JSON.stringify(pageErrors)}`);
            if(badResponses.length) failures.push(`${size.name}: bad responses ${JSON.stringify(badResponses)}`);
            if(requestFailures.length) failures.push(`${size.name}: request failures ${JSON.stringify(requestFailures)}`);
            await context.close();
          }

          // Sidebar expand / persist / collapse on production.
          {
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            await page.goto(process.env.BASE_URL+'/',{waitUntil:'networkidle'});
            await page.locator('h1').first().waitFor({state:'visible'});
            await page.evaluate(()=>localStorage.setItem('genai-student-sidebar-expanded-v1','false'));
            await page.reload({waitUntil:'networkidle'});
            const read=()=>page.evaluate(()=>{
              const nav=document.querySelector('#main-navigation');
              const frame=document.querySelector('.app-frame--student');
              const header=document.querySelector('.app-header--student');
              return {
                navWidth:nav?Math.round(nav.getBoundingClientRect().width):0,
                framePadding:frame?Math.round(parseFloat(getComputedStyle(frame).paddingLeft)):0,
                headerLeft:header?Math.round(parseFloat(getComputedStyle(header).left)):0,
                stored:localStorage.getItem('genai-student-sidebar-expanded-v1'),
              };
            });
            const collapsed=await read();
            await page.getByRole('button',{name:/mở rộng thanh điều hướng/i}).click();
            await page.waitForTimeout(250);
            const expanded=await read();
            await page.screenshot({path:`${out}/desktop-sidebar-expanded.png`,fullPage:true});
            await page.reload({waitUntil:'networkidle'});
            await page.waitForTimeout(250);
            const persisted=await read();
            await page.getByRole('button',{name:/thu gọn thanh điều hướng/i}).click();
            await page.waitForTimeout(250);
            const collapsedAgain=await read();
            if(collapsed.navWidth!==80) failures.push(`sidebar initial width ${collapsed.navWidth}`);
            if(expanded.navWidth!==280||expanded.framePadding!==280||expanded.headerLeft!==280) failures.push(`sidebar expanded layout invalid ${JSON.stringify(expanded)}`);
            if(persisted.navWidth!==280||persisted.stored!=='true') failures.push(`sidebar persistence invalid ${JSON.stringify(persisted)}`);
            if(collapsedAgain.navWidth!==80) failures.push(`sidebar collapse invalid ${JSON.stringify(collapsedAgain)}`);
            report.push({interaction:'sidebar',collapsed,expanded,persisted,collapsedAgain});
            await context.close();
          }

          fs.writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failures.length){console.error('\nPRODUCTION FAILURES\n'+failures.join('\n'));process.exit(1);}
          JS
          node student-v2-prod.mjs
      - name: Upload production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-v2-production
          path: /tmp/student-v2-production
          retention-days: 3
