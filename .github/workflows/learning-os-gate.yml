name: Learning OS Gate

on:
  push:
    branches:
      - feat/learning-os

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Architecture
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Start preview
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/learning-os-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/learning-os-preview.log
          exit 1
      - name: Visual smoke
        run: |
          cat > learning-os-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/learning-os-smoke'; fs.mkdirSync(out,{recursive:true});
          const executablePath=['/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!executablePath) throw new Error('No chromium');
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const routes=['/','/hoc-bai','/tu-giai','/replay'];
          const sizes=[{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}];
          const failures=[];
          for(const size of sizes){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height}});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
            for(const route of routes){
              const res=await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle',timeout:45000});
              await page.waitForTimeout(250);
              const metrics=await page.evaluate(()=>({
                width:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                h1:[...document.querySelectorAll('h1')].filter(el=>getComputedStyle(el).display!=='none').map(el=>el.textContent?.trim()).filter(Boolean),
                dialog:[...document.querySelectorAll('dialog')].map(el=>({open:el.open,display:getComputedStyle(el).display})),
                tiny:[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&parseFloat(s.fontSize)<12&&!el.classList.contains('sr-only')&&!el.closest('.katex')}).length
              }));
              if(res?.status()!==200) failures.push(`${size.name}${route}: HTTP ${res?.status()}`);
              if(metrics.scrollWidth!==metrics.width) failures.push(`${size.name}${route}: overflow ${metrics.scrollWidth}>${metrics.width}`);
              if(metrics.tiny) failures.push(`${size.name}${route}: tiny text ${metrics.tiny}`);
              if(metrics.dialog.some(d=>!d.open&&d.display!=='none')) failures.push(`${size.name}${route}: closed dialog visible`);
              if(!metrics.h1.length) failures.push(`${size.name}${route}: missing h1`);
              await page.screenshot({path:`${out}/${size.name}-${route==='/'?'mission':route.slice(1)}.png`,fullPage:true});
            }
            if(errors.length) failures.push(`${size.name}: console ${JSON.stringify(errors)}`);
            await context.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n')); process.exit(1);}
          JS
          node learning-os-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-os-smoke
          path: /tmp/learning-os-smoke
          retention-days: 3
